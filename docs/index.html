<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiCounter</title>
  <style>
    :root {
      --bg: #000000;
      --text: #fbfbfb;
      --muted: #989898;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    .summary {
      margin: 0 0 24px;
      color: var(--muted);
    }
    h2 {
      margin: 24px 0 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .game {
      display: grid;
      grid-template-columns: 1fr auto auto 12px auto auto;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .chip {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }
    .score {
      min-width: 32px;
      text-align: center;
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }
    .colon {
      text-align: center;
      color: var(--muted);
      font-size: 22px;
    }
    .lost { opacity: 0.4; }
    .empty a { color: var(--text); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="codec.js"></script>
  <script>
    var ru = /^ru/i.test(navigator.language || '')
    var T = ru ? {
      title: 'MiCounter — история игр',
      games: function (n) { return 'Игр: ' + n },
      empty: 'Откройте эту страницу через QR-код на экране итога MiCounter.',
      bad: 'Не удалось разобрать данные из ссылки.',
      repo: 'О приложении'
    } : {
      title: 'MiCounter — game history',
      games: function (n) { return n === 1 ? '1 game' : n + ' games' },
      empty: 'Open this page by scanning the QR code on the MiCounter result screen.',
      bad: 'Could not read the data in this link.',
      repo: 'About the app'
    }
    document.documentElement.lang = ru ? 'ru' : 'en'
    document.title = T.title

    function el(tag, cls, text) {
      var e = document.createElement(tag)
      if (cls) e.className = cls
      if (text !== undefined) e.textContent = text
      return e
    }

    function pad(n) { return (n < 10 ? '0' : '') + n }
    function clock(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) }
    function day(ms) {
      return new Date(ms).toLocaleDateString(ru ? 'ru-RU' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })
    }

    function chip(game, i, lost) {
      var c = el('div', 'chip' + (lost ? ' lost' : ''), game.labels[i])
      c.style.background = game.bg[i]
      c.style.color = game.digits[i]
      // Чёрная плашка на чёрной странице не видна — обводим её
      if (game.bg[i] === '#000000') c.style.boxShadow = 'inset 0 0 0 1px #3a3a3a'
      return c
    }

    function render() {
      var app = document.getElementById('app')
      app.textContent = ''
      app.appendChild(el('h1', '', T.title))

      if (!location.hash || location.hash === '#') {
        var p = el('p', 'summary empty', T.empty + ' ')
        var a = el('a', '', T.repo)
        a.href = 'https://github.com/iliin-ivig/micounter'
        p.appendChild(a)
        app.appendChild(p)
        return
      }
      var games = decodeGames(location.hash)
      if (!games) {
        app.appendChild(el('p', 'summary', T.bad))
        return
      }
      app.appendChild(el('p', 'summary', T.games(games.length)))

      var lastDay = ''
      games.forEach(function (g) {
        var d = day(g.start)
        if (d !== lastDay) {
          app.appendChild(el('h2', '', d))
          lastDay = d
        }
        var row = el('div', 'game')
        row.appendChild(el('div', 'time', clock(g.start) + (g.end === null ? '' : ' – ' + clock(g.end))))
        var lost = [g.scores[0] < g.scores[1], g.scores[1] < g.scores[0]]
        row.appendChild(chip(g, 0, lost[0]))
        row.appendChild(el('div', 'score' + (lost[0] ? ' lost' : ''), g.scores[0]))
        row.appendChild(el('div', 'colon', ':'))
        row.appendChild(el('div', 'score' + (lost[1] ? ' lost' : ''), g.scores[1]))
        row.appendChild(chip(g, 1, lost[1]))
        app.appendChild(row)
      })
    }

    window.addEventListener('hashchange', render)
    render()
  </script>
</body>
</html>
